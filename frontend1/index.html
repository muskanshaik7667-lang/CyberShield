<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigil AI - Next-Gen Threat Intelligence & Security Platform</title>

    <!-- Google Fonts: Cormorant Garamond (Headings) and DM Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#020617',
                            card: '#071426',
                            primary: '#00BFFF',
                            secondary: '#8B5CF6',
                            accent: '#00E5FF',
                            success: '#22C55E',
                            warning: '#FACC15',
                            critical: '#EF4444'
                        }
                    },
                    fontFamily: {
                        heading: ['Cormorant Garamond', 'serif'],
                        body: ['DM Sans', 'sans-serif']
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 30s linear infinite',
                    }
                }
            }
        }
    </script>

    <!-- Global Styles for Animations and Particle Cursors -->
    <link rel="stylesheet" href="style.css">

    <!-- UMD Libraries -->
    <!-- React & React-DOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (In-Browser Transpiler for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Three.js (3D Graphics Core) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- GSAP (High Performance Animation & Parallax Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- tsParticles (Background Cyber Network Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <!-- Lucide Icons Core -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Chart.js (Analytics Reporting) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-cyber-dark text-white font-body selection:bg-cyber-accent selection:text-black overflow-x-hidden">

    <!-- Custom Particle Cursor Elements -->
    <div id="custom-cursor" class="pointer-events-none fixed w-6 h-6 rounded-full border border-cyber-accent opacity-0 z-50 transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-75 ease-out shadow-[0_0_15px_#00E5FF]"></div>
    <div id="cursor-glow" class="pointer-events-none fixed w-32 h-32 bg-cyber-primary/10 rounded-full blur-2xl opacity-0 z-40 transform -translate-x-1/2 -translate-y-1/2 transition-all duration-100 ease-out"></div>

    <!-- Background Network Canvas (tsParticles) -->
    <div id="tsparticles" class="absolute inset-0 z-0 pointer-events-none"></div>

    <!-- Ambient Digital Cyber-Grid Background Layer -->
    <div class="cyber-grid absolute inset-0 z-0 opacity-20 pointer-events-none"></div>

    <!-- Soft Fog & Lighting Ambient Overlays -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0">
        <div class="absolute top-1/4 left-1/4 w-[50vw] h-[50vh] bg-cyber-primary/5 rounded-full blur-[150px] animate-pulse-slow"></div>
        <div class="absolute bottom-1/4 right-1/4 w-[50vw] h-[50vh] bg-cyber-secondary/5 rounded-full blur-[150px] animate-pulse-slow"></div>
    </div>

    <!-- Initial Dynamic Loading Screen -->
    <div id="loader" class="fixed inset-0 bg-cyber-dark z-50 flex flex-col justify-center items-center gap-6 transition-all duration-700 ease-out">
        <div class="relative w-24 h-24">
            <div class="absolute inset-0 border-2 border-cyber-accent/10 rounded-full"></div>
            <div class="absolute inset-0 border-t-2 border-r-2 border-cyber-accent rounded-full animate-spin"></div>
            <div class="absolute inset-4 flex items-center justify-center">
                <span class="font-heading text-lg text-cyber-accent font-semibold tracking-wider">CS</span>
            </div>
        </div>
        <div class="flex flex-col items-center gap-2">
            <h2 class="font-heading text-2xl font-semibold text-white tracking-widest">Vigil AI</h2>
            <p class="text-xs text-cyber-primary font-mono uppercase tracking-[0.3em] animate-pulse">Initializing Neural Core...</p>
        </div>
    </div>

    <!-- React App Root -->
    <div id="root" class="relative z-10 min-h-screen"></div>

    <!-- Core App Logic (React Components & WebGL Shield) -->
    <script type="text/babel" data-type="module" src="script.js"></script>

    <!-- Custom Initializer for Loader Fadeout -->
    <script>
        // Set a timeout to fade out loader if compilation succeeds, 
        // will be handled explicitly inside script.js react mount.
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 700);
                }
            }, 1500); // Fail-safe loader timeout
        });
    </script>
</body>
</html>
